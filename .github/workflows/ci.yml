# Layer 3 of the gate. Repeats every pre-commit hook, because hooks can be
# bypassed with --no-verify, and adds what cannot run locally: the test
# matrix across supported Python versions, and coverage measurement.
#
# Third-party actions are pinned to a commit SHA with the version in a
# trailing comment — a tag can be repointed at different code, a SHA
# cannot. Dependabot still bumps them by reading the comment.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install --upgrade pip ruff

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format
        run: ruff format --check .

      - name: Comment layout
        # Standard library only, so it needs nothing installed above. Roots
        # are listed rather than globbed, so a new top-level directory is a
        # deliberate addition here rather than silently unchecked (ADR-016).
        run: python tools/check_comment_layout.py src tests examples tools

      - name: Code citations
        # Standard library only, like the check above. Bans an issue, PR
        # or record number in a comment or docstring: code outlives the
        # tracker, and markdown is where a number belongs.
        run: python tools/check_code_citations.py src tests examples tools

      - name: Journal order
        # Standard library only, like the check above. The path is named
        # for the same reason the roots are: a second journal would be a
        # deliberate addition here rather than silently unchecked.
        run: python tools/check_journal_order.py docs/dev-journal.md

      - name: Diagram exports
        # Standard library only, like the two above. Reads the committed
        # PNG's header rather than the image, so it needs no draw.io and
        # no display — which is what lets the export scale be gated at
        # all, since the render does not show it (#151).
        run: python tools/check_diagram_exports.py docs/assets

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install
        run: python -m pip install --upgrade pip mypy
      - name: Type check
        run: mypy

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range. requires-python is >=3.10, so
        # 3.10 catches accidental use of newer syntax and 3.13 catches
        # deprecations before they become errors.
        #
        # Windows is here because chrome.py is Windows-only — it shells out
        # to tasklist, and on Linux that call raises FileNotFoundError into
        # a broad except, so every test touching the reaper exercises the
        # no-op path. Without a Windows runner the one platform-specific
        # module in the package was never run by CI on the platform it
        # targets. Windows is also the documented development platform:
        # every command in the README uses the `py` launcher.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # Installing the package from pyproject.toml proves it is valid and
        # that tier 1 genuinely needs no third-party dependency. The dev
        # extra supplies the test tooling, so CI and a local checkout run
        # the same declared versions rather than whatever pip resolves.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test with coverage
        # The coverage floor lives in pyproject.toml; it fails the job.
        # Linux and Windows cover different branches of chrome.py, so the
        # floor has to hold on both.
        run: pytest --cov=pagefetch

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The lowest supported version, so an example cannot quietly
          # depend on syntax a reader on 3.10 does not have.
          python-version: "3.10"
      - name: Install
        # Without the dev extra on purpose. An example is what a consumer
        # runs after installing the library, so it has to work with the
        # library alone — no pytest, no browsers, and no network.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Run every example
        # Globbed rather than listed, so a new file under examples/ is
        # covered without editing this job. A failure here means an example
        # rotted against the library it documents, which is the reason they
        # are executed rather than pasted into a document.
        run: |
          set -euo pipefail
          for f in examples/*.py; do
            echo "--- ${f}"
            python "${f}"
          done

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Single required status check for branch protection. Without this, each
  # job has to be named individually in the ruleset, and a job added later
  # is not required until someone remembers to add it.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [lint, types, test, examples, secrets]
    if: always()
    steps:
      - name: Check results
        # A skipped or cancelled dependency is not a pass. Every job here
        # is unconditional, so anything other than success is a failure.
        run: |
          set -euo pipefail
          results="${{ join(needs.*.result, ' ') }}"
          echo "Dependency results: ${results}"
          for r in ${results}; do
            if [ "${r}" != "success" ]; then
              echo "::error::A required job did not succeed: ${results}"
              exit 1
            fi
          done
          echo "All required jobs succeeded."
