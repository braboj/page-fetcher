[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pagefetch"
version = "0.1.0"
description = "Auto-escalating web page fetcher: plain HTTP first, browsers only when the response is a bot wall, an error, or implausibly short."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Branimir Georgiev" }]
keywords = ["scraping", "fetch", "cache", "cloudflare", "bot-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]

# Tier 1 (urllib) is standard library only, so the package installs with no
# dependencies at all. The browser tiers are lazily imported and skipped
# when absent — see the extras below.
dependencies = []

[project.optional-dependencies]
# Tier 2 needs `playwright install chromium` after pip install.
# Tier 3 (nodriver) is AGPL-3.0 — see the README's Dependencies section
# before shipping a network service built on it.
browsers = ["playwright>=1.61.0", "nodriver>=0.50.3", "seleniumbase>=4.51.8"]
dev = [
    "ruff>=0.16",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.1",
]

[project.urls]
Homepage = "https://github.com/braboj/page-fetcher"
Issues = "https://github.com/braboj/page-fetcher/issues"

[project.scripts]
pagefetch = "pagefetch.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
# Tests and examples ship with the repository, not the wheel — the captured
# HTML fixtures alone are larger than the package, and an example is only
# useful beside the source it explains. Under the src/ layout both sit
# outside the package, so neither has to be excluded by hand.
include = ["pagefetch*"]

[tool.ruff]
line-length = 88
target-version = "py310"
# The vendored template system is a submodule with its own toolchain and
# its own CI. Linting it here reports 85 errors that no commit in this
# repository can fix, and breaks the `ruff check .` the README tells
# contributors to run.
extend-exclude = ["docs/solid-ai-templates"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit
    "BLE",  # flake8-blind-except
    "PL",   # pylint
    "RUF",  # ruff-specific
    "D",    # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Every exemption below is deliberate, and PLAYBOOK 3.1 states why each
# one stands. None is here because the rule was inconvenient.
#
# Broad excepts and best-effort teardown keep the ladder falling through
# to the next tier; lazy imports keep the optional engines optional.
"src/pagefetch/network.py" = ["BLE001", "S110", "PLC0415", "PLR0911"]

# `tasklist` resolves via PATH, because a hardcoded System32 path breaks
# on non-default Windows installs.
"src/pagefetch/chrome.py" = ["BLE001", "S110", "S607"]

# pytest's assert-based style, its literal comparisons, and the one stub
# helper taking an argument per tier. A test named after its assertion
# gains nothing from a docstring restating it.
"tests/**" = ["S101", "PLR2004", "PLR0913", "PLR0917", "S311", "D"]

# The assertions are what the example demonstrates.
"examples/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
# The package, its suite, the examples and the dev tools are four roots
# under the src/ layout. Listing only "src" would silently stop
# type-checking the rest — and an example that no longer type-checks is a
# published mistake, while a tool that no longer type-checks gates every
# commit in the repository.
files = ["src", "tests", "examples", "tools"]
# tools/ is a directory of scripts, not an installed package, so its
# modules are only importable by the suite through this path.
mypy_path = "tools"
# The browser tiers are lazily imported and optional, so their stubs are
# absent in a plain `pip install -e .` checkout and in CI.
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# tools/ ships with the repository but is not part of the wheel, so the
# suite cannot reach its modules through the install the way it reaches
# pagefetch. This puts them on the path for test_comment_layout.py.
pythonpath = ["tools"]

[tool.coverage.run]
# Named as an import, so it resolves through the install rather than the
# working directory — which is the whole point of the src/ layout. The
# suite sits outside the package now, so no omit pattern is needed to keep
# it out of the figure.
source = ["pagefetch"]

[tool.coverage.report]
show_missing = true
# A ratchet sized from the measured baseline, never from a target picked
# by feel: raise it as the testable surface grows, never lower it to make
# a change pass. PLAYBOOK 3.3 has the history and what stays uncovered.
fail_under = 76
