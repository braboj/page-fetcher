[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pagefetch"
version = "0.1.0"
description = "Auto-escalating web page fetcher: plain HTTP first, browsers only when the response is a bot wall, an error, or implausibly short."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Branimir Georgiev" }]
keywords = ["scraping", "fetch", "cache", "cloudflare", "bot-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]

# Tier 1 (urllib) is standard library only, so the package installs with no
# dependencies at all. The browser tiers are lazily imported and skipped
# when absent — see the extras below.
dependencies = []

[project.optional-dependencies]
# Tier 2 needs `playwright install chromium` after pip install.
# Tier 3 (nodriver) is AGPL-3.0 — see the README's Dependencies section
# before shipping a network service built on it.
browsers = ["playwright>=1.61.0", "nodriver>=0.50.3", "seleniumbase>=4.51.8"]
dev = [
    "ruff>=0.16",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.1",
]

[project.urls]
Homepage = "https://github.com/braboj/page-fetcher"
Issues = "https://github.com/braboj/page-fetcher/issues"

[project.scripts]
pagefetch = "pagefetch.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
# Tests and examples ship with the repository, not the wheel — the captured
# HTML fixtures alone are larger than the package, and an example is only
# useful beside the source it explains. Under the src/ layout both sit
# outside the package, so neither has to be excluded by hand (ADR-010).
include = ["pagefetch*"]

[tool.ruff]
line-length = 88
target-version = "py310"
# The vendored template system is a submodule with its own toolchain and
# its own CI. Linting it here reports 85 errors that no commit in this
# repository can fix, and breaks the `ruff check .` the README tells
# contributors to run.
extend-exclude = ["docs/solid-ai-templates"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit
    "BLE",  # flake8-blind-except
    "PL",   # pylint
    "RUF",  # ruff-specific
    "D",    # pydocstyle
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# The escalation ladder catches broad exceptions on purpose: any failure
# inside a tier — a missing browser binary, a CDP disconnect, a driver
# crash — must fall through to the next tier rather than abort the fetch.
# Narrowing these would couple the fetcher to each engine's exception
# hierarchy, which is exactly the coupling the PageSource ABC avoids.
# S110 (try-except-pass) covers the best-effort browser teardown paths for
# the same reason: a failure while closing a browser must not mask the
# result already fetched.
#
# PLC0415 (import not at top level): the browser libraries are imported
# inside the tier methods deliberately, so the package installs and runs
# with none of them present. Hoisting them to module scope would make
# every optional dependency mandatory.
#
# PLR0911 (too many returns): the escalation orchestrator returns from
# each tier as it succeeds. Collapsing that into one exit point would
# need a result variable threaded through every branch, which reads worse
# than the early returns.
"src/pagefetch/network.py" = ["BLE001", "S110", "PLC0415", "PLR0911"]
# S607 (partial executable path): `tasklist` is resolved via PATH on
# purpose — hardcoding a System32 path breaks on non-default Windows
# installs, and the call is already best-effort.
"src/pagefetch/chrome.py" = ["BLE001", "S110", "S607"]
# pytest's assert-based style (S101 flags every assertion) and its habit
# of comparing against literals (PLR2004). The tier-stub helper takes one
# argument per tier, which trips the argument-count rules. S311 flags
# `random` as non-cryptographic, which is the point — a seeded generator
# builds a deterministic incompressible fixture.
#
# D (pydocstyle): a docstring on `test_undecompressable_body_is_not_cached`
# restates the name. The naming convention already carries a test's intent,
# so the rule would buy 209 lines of restatement and no information.
"tests/**" = ["S101", "PLR2004", "PLR0913", "PLR0917", "S311", "D"]
# S101 (assert): the FakeFetcher example is a consumer's test pattern made
# executable, and the assertions are what it demonstrates. Printing
# PASS/FAIL instead would show a way nobody writes tests.
"examples/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
# The package, its suite and the examples are three roots under the src/
# layout. Listing only "src" would silently stop type-checking the other
# two — and an example that no longer type-checks is a published mistake.
files = ["src", "tests", "examples"]
# The browser tiers are lazily imported and optional, so their stubs are
# absent in a plain `pip install -e .` checkout and in CI.
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
# Named as an import, so it resolves through the install rather than the
# working directory — which is the whole point of the src/ layout
# (ADR-010). The suite sits outside the package now, so no omit pattern is
# needed to keep it out of the figure.
source = ["pagefetch"]

[tool.coverage.report]
show_missing = true
# Sized from the measured baseline, not from a target picked by feel.
# Raised 45 -> 63 when the batch path was brought under test (#4), 63 -> 70
# when the CLI first came under test (#13, #14), and 70 -> 76 when the
# remaining argument parsing did (#22, #24) — __main__ reached 99%, all but
# the __main__ guard. The measured figure is ~79%. The floor has to hold on
# every matrix leg, so it tracks the lowest; the legs sit within a fraction
# of a point of each other now that chrome.py no longer queries the host,
# but the gap stays as headroom rather than being spent. What is left
# uncovered is the browser-tier method bodies, which need a headed Chrome
# and are validated by hand. This is a ratchet floor that must not regress,
# NOT a quality claim — raise it again as the testable surface grows. See
# ADR-002.
fail_under = 76
