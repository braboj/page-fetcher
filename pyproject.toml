# =============================================================================
# PYPROJECT.TOML
# =============================================================================
# This file is the configuration for the Python project. It specifies the
# build system, project metadata, dependencies, optional dependencies, URLs,
# scripts, and various tool configurations for linting, type checking,
# testing, and code coverage.
# =============================================================================


# =============================================================================
# BUILD SYSTEM CONFIGURATION
# =============================================================================
# The build system configuration specifies the requirements for building the
# project and the backend to use for building.
# =============================================================================
[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"


# =============================================================================
# PROJECT METADATA
# =============================================================================
# The project metadata section contains information about the project, such
# as its name, version, description, license, authors, keywords, and
# classifiers. It also specifies the dependencies required for the project
# and any optional dependencies.
# =============================================================================
[project]
name = "pagefetch"
version = "0.1.0"
description = """\
Auto-escalating web page fetcher: plain HTTP first, browsers only when the \
response is a bot wall, an error, or implausibly short.\
"""
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Branimir Georgiev" }]
keywords = ["scraping", "fetch", "cache", "cloudflare", "bot-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

# =============================================================================
# OPTIONAL DEPENDENCIES
# =============================================================================
# The optional dependencies section specifies additional packages that can be
# installed to enable specific features of the project. In this case, there
# are optional dependencies for browser automation and development tools. The
# "browsers" optional dependency includes packages for browser automation,
# while the "dev" optional dependency includes packages for development tasks
# such as linting, type checking, testing, and pre-commit hooks.
# =============================================================================
[project.optional-dependencies]
browsers = ["playwright>=1.61.0", "nodriver>=0.50.3", "seleniumbase>=4.51.8"]
dev = [
    "ruff>=0.16",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.1",
]

#=============================================================================
# PROJECT URLS
#=============================================================================
# The project URLs section specifies the homepage and issue tracker URLs for
# the project.
#=============================================================================
[project.urls]
Homepage = "https://github.com/braboj/page-fetcher"
Issues = "https://github.com/braboj/page-fetcher/issues"

#=============================================================================
# PROJECT SCRIPTS
#=============================================================================
# The project scripts section specifies the command-line scripts that can be
# run from the terminal. In this case, the "pagefetch" script is defined,
# which points to the main function in the "pagefetch.__main__" module.
#=============================================================================
[project.scripts]
pagefetch = "pagefetch.__main__:main"

#=============================================================================
# SETUPTOOLS CONFIGURATION
#=============================================================================
# The setuptools configuration section specifies the package discovery
# settings for the project. It indicates that the source code is located in
# the "src" directory and includes packages that match the "pagefetch*"
# pattern.
#=============================================================================
[tool.setuptools.packages.find]
where = ["src"]
include = ["pagefetch*"]

#=============================================================================
# RUFF CONFIGURATION
#=============================================================================
# Ruff is a fast Python linter and code formatter. The following
# configuration specifies the line length, target Python version, excluded
# files, and linting rules to apply. It also includes per-file ignores for
# specific files that may have different coding standards or are not part of
# the main package. The configuration also specifies the pydocstyle
# convention to use for docstring validation.
#=============================================================================
[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["docs/solid-ai-templates"]
[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit
    "BLE",  # flake8-blind-except
    "PL",   # pylint
    "RUF",  # ruff-specific
    "D",    # pydocstyle
]

#=============================================================================
# Pydocstyle Configuration
#=============================================================================
# Pydocstyle is a tool for checking compliance with Python docstring
# conventions. The following configuration specifies the docstring convention
# to use. In this case, it uses the "google" convention, which enforces the
# Google style for docstrings.
#=============================================================================
[tool.ruff.lint.pydocstyle]
convention = "google"

# =============================================================================
# PER-FILE IGNORES
# =============================================================================
# The files below carry an exemption because the rule and the code disagree
# for a stated reason, never because the rule was inconvenient. Each entry
# names the rule as ruff names it, and PLAYBOOK 3.1 gives each in full. Fix
# the code rather than widening a rule.
# =============================================================================
[tool.ruff.lint.per-file-ignores]
"src/pagefetch/network.py" = [
    "BLE001",   # blind-except: a tier failure must fall through
    "S110",     # try-except-pass: best-effort browser teardown
    "PLC0415",  # import-outside-top-level: engines stay optional
    "PLR0911",  # too-many-return-statements: one exit per tier
]
"src/pagefetch/chrome.py" = [
    "BLE001",   # blind-except: a host probe must not abort the fetch
    "S110",     # try-except-pass: best-effort teardown
    "S607",     # start-process-with-partial-path: tasklist via PATH
]
"tests/**" = [
    "S101",     # assert: pytest's assertion style
    "PLR2004",  # magic-value-comparison: literals in assertions
    "PLR0913",  # too-many-arguments: the tier-stub helper
    "PLR0917",  # too-many-positional-arguments: the same helper
    "S311",     # non-cryptographic-random: a seeded fixture is the point
    "D",        # pydocstyle: a test name already carries its intent
]
"examples/**" = [
    "S101",     # assert: the assertions are what the example demonstrates
]

# =============================================================================
# MYPY CONFIGURATION
# =============================================================================
# Mypy is a static type checker for Python. The following configuration
# specifies the Python version, the files to check, and various options for
# handling imports and warnings.
# =============================================================================
[tool.mypy]
python_version = "3.10"
files = ["src", "tests", "examples", "tools"]
mypy_path = "tools"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# =============================================================================
# PYTEST CONFIGURATION
# =============================================================================
# Pytest is a testing framework for Python. The following configuration
# specifies the test paths, additional options, and the Python path for the
# tests.
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]   # The directory where the test files are located
pythonpath = ["tools"]  # Directories added to the Python path for the tests
addopts = "-q"          # Additional command-line options (quiet mode)

#=============================================================================
# COVERAGE CONFIGURATION
#=============================================================================
# Coverage.py is a tool for measuring code coverage of Python programs. The
# following configuration specifies the source files to measure, reporting
# options, and the minimum coverage threshold for the tests.
#=============================================================================
[tool.coverage.run]
source = ["pagefetch"]

#=============================================================================
# COVERAGE REPORT CONFIGURATION
#=============================================================================
# The floor is a ratchet sized from the measured baseline, never from a
# target picked by feel: raise it as the testable surface grows, never lower
# it to make a change pass. PLAYBOOK 3.3 has the history and what stays
# uncovered.
#=============================================================================
[tool.coverage.report]
show_missing = true
fail_under = 76
