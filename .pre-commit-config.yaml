# Layer 2 of the gate: fast checks that block a bad commit locally.
# CI repeats all of it, because hooks can be bypassed with --no-verify.
#
# Install once per clone:  pre-commit install
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Captured fixtures are byte-for-byte snapshots of real responses.
        exclude: ^tests/fixtures/
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-toml
      - id: check-yaml
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^tests/fixtures/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        # Mirror pyproject's file list; the hook otherwise passes only the
        # changed files and misses cross-module type errors.
        args: [--config-file=pyproject.toml]
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # The project-local hooks, for conventions no linter in the list above
  # expresses. Both were adopted after review had been given the job and
  # had missed it: 26 comment-layout sites accumulated across the package
  # and the suite (ADR-016), and the journal was newest-first for twenty
  # sessions against a rule the pinned template already carried.
  #
  # `language: python` rather than `system` for both: the scripts need
  # nothing but the standard library, but `system` resolves `python` from
  # PATH, and the documented Windows workflow uses the `py` launcher —
  # where PATH has no `python` at all. Letting pre-commit supply the
  # interpreter is what makes the hooks run on both platforms.
  - repo: local
    hooks:
      - id: comment-layout
        name: comment layout
        entry: python tools/check_comment_layout.py
        language: python
        types: [python]
        # Roots are listed rather than passed as changed filenames: the
        # rule is about a comment's neighbours, so checking a file in
        # isolation is the same work as checking all four roots.
        pass_filenames: false
        args: [src, tests, examples, tools]

      - id: journal-order
        name: journal order
        entry: python tools/check_journal_order.py
        language: python
        # Named rather than passed as a changed filename, for the same
        # reason as above: the rule is about an entry's neighbours. The
        # `files` pattern is what keeps the hook off every other commit.
        files: ^docs/dev-journal\.md$
        pass_filenames: false
        args: [docs/dev-journal.md]
